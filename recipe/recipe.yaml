schema_version: 1

context:
  version: 0.22.1
  build_number: '0'

package:
  name: thefuzz
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/t/thefuzz/thefuzz-${{ version }}.tar.gz
  sha256: 7138039a7ecf540da323792d8592ef9902b1d79eb78c147d4f20664de79f3680

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-levenshtein >=0.12

tests:
  - python:
      imports:
        - thefuzz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Fuzzy string matching in python
  license: GPL-2.0-only
  license_file: LICENSE.txt
  description: |
    Fuzzy string matching like a boss. It uses [Levenshtein Distance][_LD] to
    calculate the differences between sequences in a simple-to-use package.

    [_LD]: https://en.wikipedia.org/wiki/Levenshtein_distance

    PyPI: [https://pypi.org/project/thefuzz/](https://pypi.org/project/thefuzz/)

  homepage: https://github.com/seatgeek/thefuzz
  repository: https://github.com/seatgeek/thefuzz
  documentation: https://github.com/seatgeek/thefuzz

extra:
  recipe-maintainers:
    - sugatoray
